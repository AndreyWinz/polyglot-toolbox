[package]
name = "dup-find"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "Fast, multi-threaded duplicate file finder using size bucketing and partial hashing."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dashmap = "6.0"
rayon = "1.10"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
